[project]
name = "docpilot-agent"
version = "0.1.0"
description = "技术文档智能助手"
readme = "README.md"
authors = [
    { name = "jyh", email = "2605813520@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
docpilot-agent = "docpilot_agent:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
